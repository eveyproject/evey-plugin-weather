name: release

# A tag vX.Y.Z builds the zip, signs it with the project key and publishes
# the zip, its .sig and its sha256 as a GitHub release. The tag must match
# the version in plugin.yaml.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Tag matches plugin.yaml
        run: |
          version=$(sed -n 's/^version: *//p' plugin.yaml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match plugin.yaml version $version" >&2
            exit 1
          fi

      - name: Public key into the package
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: cosign public-key --key env://COSIGN_PRIVATE_KEY > cosign.pub

      - name: Build
        id: build
        run: echo "zip=$(./scripts/build-zip.sh | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Sign and verify
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false \
            --output-signature "$ZIP.sig" "$ZIP"
          cosign verify-blob --key cosign.pub --signature "$ZIP.sig" --insecure-ignore-tlog "$ZIP"
          (cd out && sha256sum "$(basename "$ZIP")" > "$(basename "$ZIP").sha256")

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          hash=$(cut -d' ' -f1 "$ZIP.sha256")
          fp=$(openssl pkey -pubin -in cosign.pub -outform DER | sha256sum | cut -d' ' -f1)
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$(basename "$ZIP")"
          {
            echo "Install in Evey (Admin > Plugins > Install Plugin > From URL):"
            echo
            echo '```'
            echo "$url#sha256:$hash"
            echo '```'
            echo
            echo "Signed by the Evey project key \`sha256:$fp\`. Evey fetches the signature at \`<url>.sig\` on its own."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md \
            "$ZIP" "$ZIP.sig" "$ZIP.sha256"
